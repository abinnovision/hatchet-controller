units:
  ".":
    release: true
    initialVersion: "0.1.0"
    tags: [source]
    versionFiles:
      - file: config/manager/kustomization.yaml
        pattern: "newTag: {version}"
      - file: README.md
        pattern: "?ref=v{version}"

branches:
  - name: main
    line: default
    channel: beta
