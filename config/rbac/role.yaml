---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - hatchet-controller.abigroup.io
  resources:
  - hatchetinstances
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - hatchet-controller.abigroup.io
  resources:
  - hatchetinstances/finalizers
  - hatchettenants/finalizers
  verbs:
  - update
- apiGroups:
  - hatchet-controller.abigroup.io
  resources:
  - hatchetinstances/status
  - hatchettenants/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - hatchet-controller.abigroup.io
  resources:
  - hatchettenants
  verbs:
  - get
  - list
  - patch
  - update
  - watch
