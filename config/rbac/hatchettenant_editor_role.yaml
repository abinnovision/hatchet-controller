apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hatchettenant-editor-role
  labels:
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
rules:
  - apiGroups:
      - hatchet-controller.abigroup.io
    resources:
      - hatchettenants
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - hatchet-controller.abigroup.io
    resources:
      - hatchettenants/status
    verbs:
      - get
