apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target:
      kind: ClusterRole
      name: manager-role
    patch: |-
      - op: add
        path: /rules/-
        value:
          apiGroups:
            - networking.k8s.io
          resources:
            - networkpolicies
          verbs:
            - create
            - get
            - list
            - patch
            - update
            - watch
  - target:
      kind: Deployment
      name: manager
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --enable-network-policy
