---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: hatchettenants.hatchet-controller.abigroup.io
spec:
  group: hatchet-controller.abigroup.io
  names:
    categories:
    - hatchet
    kind: HatchetTenant
    listKind: HatchetTenantList
    plural: hatchettenants
    shortNames:
    - ht
    singular: hatchettenant
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.instanceRef.name
      name: Instance
      type: string
    - jsonPath: .status.slug
      name: Slug
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: HatchetTenant declares a Hatchet tenant and its worker credential
          Secret.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HatchetTenantSpec defines the desired Hatchet tenant.
            properties:
              displayName:
                description: DisplayName is the Hatchet tenant name, kept in sync;
                  defaults to <namespace>/<name>.
                maxLength: 256
                type: string
              instanceRef:
                description: InstanceRef references the HatchetInstance hosting the
                  tenant.
                properties:
                  name:
                    description: Name of the HatchetInstance.
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace of the HatchetInstance.
                    maxLength: 63
                    minLength: 1
                    type: string
                required:
                - name
                - namespace
                type: object
              members:
                description: Members are people invited to the tenant. The controller
                  only manages members it invited.
                items:
                  description: Member is a person invited to the Hatchet tenant.
                  properties:
                    email:
                      description: Email of the person; it must be lowercase because
                        Hatchet compares invite emails exactly.
                      maxLength: 254
                      pattern: ^[^A-Z\s@]+@[^A-Z\s@]+\.[^A-Z\s@]+$
                      type: string
                      x-kubernetes-validations:
                      - message: email must be lowercase
                        rule: self == self.lowerAscii()
                    role:
                      default: MEMBER
                      description: Role of the person in the tenant; VIEWER needs
                        Hatchet v0.112 or newer.
                      enum:
                      - OWNER
                      - ADMIN
                      - MEMBER
                      - VIEWER
                      type: string
                  required:
                  - email
                  type: object
                maxItems: 100
                type: array
                x-kubernetes-list-map-keys:
                - email
                x-kubernetes-list-type: map
              secretName:
                description: SecretName is the worker Secret name; defaults to <name>-hatchet.
                maxLength: 253
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              tokenTTL:
                default: 8760h
                description: |-
                  TokenTTL is the lifetime of issued API tokens; rotation happens at 2/3 of it.
                  The API server defaults it, so it is set on objects read from the cluster.
                maxLength: 64
                type: string
                x-kubernetes-validations:
                - message: tokenTTL must be at least 24h
                  rule: duration(self) >= duration('24h')
                - message: tokenTTL must be at most 8760h
                  rule: duration(self) <= duration('8760h')
              webhooks:
                description: Webhooks are incoming Hatchet webhooks managed for the
                  tenant.
                items:
                  description: Webhook is an incoming Hatchet webhook. Credentials
                    are read from Secrets in the tenant's namespace.
                  properties:
                    auth:
                      description: Auth selects how Hatchet authenticates incoming
                        requests.
                      properties:
                        apiKey:
                          description: WebhookAPIKeyAuth authenticates requests with
                            a static header value.
                          properties:
                            apiKeySecretRef:
                              description: APIKeySecretRef selects the Secret key
                                holding the API key.
                              properties:
                                key:
                                  description: Key within the Secret.
                                  maxLength: 253
                                  minLength: 1
                                  type: string
                                name:
                                  description: Name of the Secret.
                                  maxLength: 253
                                  minLength: 1
                                  type: string
                              required:
                              - key
                              - name
                              type: object
                            headerName:
                              description: HeaderName carries the API key.
                              minLength: 1
                              type: string
                          required:
                          - apiKeySecretRef
                          - headerName
                          type: object
                        basic:
                          description: WebhookBasicAuth authenticates requests with
                            HTTP basic auth.
                          properties:
                            passwordSecretRef:
                              description: PasswordSecretRef selects the Secret key
                                holding the password.
                              properties:
                                key:
                                  description: Key within the Secret.
                                  maxLength: 253
                                  minLength: 1
                                  type: string
                                name:
                                  description: Name of the Secret.
                                  maxLength: 253
                                  minLength: 1
                                  type: string
                              required:
                              - key
                              - name
                              type: object
                            username:
                              description: Username expected in the Authorization
                                header.
                              minLength: 1
                              type: string
                          required:
                          - passwordSecretRef
                          - username
                          type: object
                        hmac:
                          description: |-
                            WebhookHMACAuth authenticates requests with an HMAC signature of the body.
                            Algorithm, encoding and signatureHeaderName are required unless the source is SVIX, which Hatchet verifies with fixed settings.
                          properties:
                            algorithm:
                              description: Algorithm is the HMAC hash.
                              enum:
                              - SHA1
                              - SHA256
                              - SHA512
                              - MD5
                              type: string
                            encoding:
                              description: Encoding is the signature encoding.
                              enum:
                              - HEX
                              - BASE64
                              - BASE64URL
                              type: string
                            signatureHeaderName:
                              description: SignatureHeaderName carries the signature.
                              minLength: 1
                              type: string
                            signingSecretRef:
                              description: SigningSecretRef selects the Secret key
                                holding the signing secret.
                              properties:
                                key:
                                  description: Key within the Secret.
                                  maxLength: 253
                                  minLength: 1
                                  type: string
                                name:
                                  description: Name of the Secret.
                                  maxLength: 253
                                  minLength: 1
                                  type: string
                              required:
                              - key
                              - name
                              type: object
                          required:
                          - signingSecretRef
                          type: object
                      type: object
                      x-kubernetes-validations:
                      - message: exactly one of basic, apiKey or hmac must be set
                        rule: '(has(self.basic) ? 1 : 0) + (has(self.apiKey) ? 1 :
                          0) + (has(self.hmac) ? 1 : 0) == 1'
                    eventKeyExpression:
                      description: EventKeyExpression is the CEL expression that derives
                        the event key from the payload.
                      maxLength: 1024
                      minLength: 1
                      type: string
                    name:
                      description: Name of the webhook; it is part of the receiver
                        URL.
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    scopeExpression:
                      description: ScopeExpression is the CEL expression that derives
                        the event scope from the payload.
                      maxLength: 1024
                      type: string
                    source:
                      default: GENERIC
                      description: Source selects the provider-specific payload handling.
                        STRIPE, SLACK and SVIX require hmac auth.
                      enum:
                      - GENERIC
                      - GITHUB
                      - STRIPE
                      - SLACK
                      - LINEAR
                      - SVIX
                      type: string
                    staticPayload:
                      description: StaticPayload is a JSON object sent with every
                        event.
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                  required:
                  - auth
                  - eventKeyExpression
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: auth must be hmac for STRIPE, SLACK and SVIX sources
                    rule: '!has(self.source) || !(self.source in [''STRIPE'', ''SLACK'',
                      ''SVIX'']) || has(self.auth.hmac)'
                  - message: hmac requires algorithm, encoding and signatureHeaderName
                      unless source is SVIX
                    rule: '!has(self.auth.hmac) || (has(self.source) && self.source
                      == ''SVIX'') || (has(self.auth.hmac.algorithm) && has(self.auth.hmac.encoding)
                      && has(self.auth.hmac.signatureHeaderName))'
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            required:
            - instanceRef
            type: object
            x-kubernetes-validations:
            - message: instanceRef is immutable
              rule: self.instanceRef == oldSelf.instanceRef
            - message: secretName is immutable
              rule: has(self.secretName) == has(oldSelf.secretName) && (!has(self.secretName)
                || self.secretName == oldSelf.secretName)
          status:
            description: HatchetTenantStatus defines the observed state of HatchetTenant.
            properties:
              conditions:
                description: Conditions describe the current state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              members:
                description: Members are the people the controller invited, which
                  it may update and remove.
                items:
                  description: MemberStatus records a person invited by the controller.
                  properties:
                    email:
                      description: Email of the person.
                      type: string
                    inviteExpiresAt:
                      description: InviteExpiresAt is the expiry of the pending invite;
                        it is only set while invited.
                      format: date-time
                      type: string
                    state:
                      description: State is Invited while the invite is pending and
                        Member once it was accepted.
                      enum:
                      - Invited
                      - Member
                      type: string
                  required:
                  - email
                  - state
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - email
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the generation last reconciled.
                format: int64
                type: integer
              slug:
                description: Slug is the Hatchet tenant slug.
                maxLength: 256
                type: string
              tenantID:
                description: TenantID mirrors the tenant-id annotation once bound.
                maxLength: 36
                type: string
              tokenExpiresAt:
                description: TokenExpiresAt is the expiry of the token in the worker
                  Secret.
                format: date-time
                type: string
              webhooks:
                description: Webhooks are the webhooks the controller created, with
                  the auth they were created with.
                items:
                  description: WebhookStatus records a webhook created by the controller.
                  properties:
                    fingerprint:
                      description: Fingerprint identifies the source and auth the
                        webhook was created with; it is a keyed hash and holds no
                        secret material.
                      type: string
                    name:
                      description: Name of the webhook.
                      type: string
                  required:
                  - fingerprint
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: metadata.name must be at most 63 characters
          rule: size(self.metadata.name) <= 63
    served: true
    storage: true
    subresources:
      status: {}
