              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HatchetTenantSpec defines the desired Hatchet tenant.
            properties:
              displayName:
                description: DisplayName is the Hatchet tenant name; defaults to metadata.name.
                maxLength: 256
                type: string
              instanceRef:
