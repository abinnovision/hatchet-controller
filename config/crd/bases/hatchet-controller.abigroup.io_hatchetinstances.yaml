  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: hatchetinstances.hatchet-controller.abigroup.io
spec:
  group: hatchet-controller.abigroup.io
  names:
    categories:
    - hatchet
    kind: HatchetInstance
    listKind: HatchetInstanceList
    plural: hatchetinstances
    shortNames:
    - hi
    singular: hatchetinstance
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .spec.apiURL
      name: API
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: HatchetInstance is a Hatchet installation that HatchetTenants
          reference.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HatchetInstanceSpec defines a Hatchet installation that tenants
              can reference.
            properties:
              allowedNamespaces:
                default:
                  from: Same
                description: AllowedNamespaces controls which namespaces may reference
                  this instance.
                properties:
                  from:
                    default: Same
                    description: From selects the allowed namespaces.
                    enum:
                    - Same
                    - Selector
                    - All
                    type: string
                  selector:
                    description: Selector matches allowed namespaces when From is
                      Selector.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                type: object
                x-kubernetes-validations:
                - message: selector is required when from is Selector
                  rule: self.from != 'Selector' || has(self.selector)
              apiURL:
                description: APIURL is the Hatchet API base URL (also HATCHET_CLIENT_SERVER_URL).
                maxLength: 2048
                pattern: ^https?://
                type: string
              networkPolicy:
                description: NetworkPolicy enables an egress NetworkPolicy per tenant;
                  absent means disabled.
                properties:
                  apiSelector:
                    additionalProperties:
                      type: string
                    description: APISelector matches the Hatchet API pods in the instance
                      namespace.
                    minProperties: 1
                    type: object
                  engineSelector:
                    additionalProperties:
                      type: string
                    description: EngineSelector matches the Hatchet engine pods in
                      the instance namespace.
                    minProperties: 1
                    type: object
                  ports:
                    description: Ports overrides the target pod ports.
                    properties:
                      api:
                        description: API is the API pod port; defaults to the port
                          of apiURL.
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                      engine:
                        description: Engine is the engine pod port; defaults to the
                          port of worker.hostPort.
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                    type: object
                required:
                - apiSelector
                - engineSelector
                type: object
              serviceUserID:
                description: ServiceUserID is the UUID of the Hatchet user the controller
                  acts as.
                format: uuid
                maxLength: 36
                type: string
                x-kubernetes-validations:
                - message: serviceUserID is immutable
                  rule: self == oldSelf
              worker:
                description: Worker holds the connection settings written into worker
                  Secrets.
                properties:
                  hostPort:
                    description: HostPort is the Hatchet engine gRPC address (HATCHET_CLIENT_HOST_PORT).
                    maxLength: 512
                    minLength: 1
                    type: string
                  tlsRootCA:
                    description: TLSRootCA is an optional PEM bundle (HATCHET_CLIENT_TLS_ROOT_CA).
                    maxLength: 65536
                    type: string
                  tlsStrategy:
                    default: tls
                    description: TLSStrategy is the worker TLS strategy (HATCHET_CLIENT_TLS_STRATEGY).
                    enum:
                    - none
                    - tls
                    - mtls
                    type: string
                required:
                - hostPort
                type: object
            required:
            - apiURL
            - serviceUserID
            - worker
            type: object
          status:
            description: HatchetInstanceStatus defines the observed state of HatchetInstance.
            properties:
              conditions:
                description: Conditions describe the current state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the generation last reconciled.
                format: int64
                type: integer
              publicKeysetSecret:
                description: PublicKeysetSecret is the Secret holding the public keyset
                  (key `keyset`).
                maxLength: 253
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
