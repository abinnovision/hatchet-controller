name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.number || github.event.merge_group.id || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  ci:
    name: CI
    uses: abinnovision/actions/.github/workflows/workflow.yaml@app-stack-v2
    permissions:
      contents: read
      packages: read
      actions: write
      id-token: write
    with:
      test-types: "unit,integration,e2e"

  publish-oci:
    name: Publish OCI
    needs: ci
    uses: abinnovision/actions/.github/workflows/workflow.yaml@publish-oci-v2
    permissions:
      contents: read
      id-token: write
      packages: write
      actions: write
    with:
      releases: ${{ needs.ci.outputs.releases }}
      image: hatchet-controller
      ghcr: true
      platforms: hatchet-controller,cross,linux/amd64,linux/arm64

  release-notes:
    name: Release notes
    needs: ci
    if: ${{ contains(needs.ci.outputs.releases, '"kind":"release"') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Appends the Hatchet versions the release was tested against, read from the tagged commit.
      - name: Add tested Hatchet versions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES: ${{ needs.ci.outputs.releases }}
        run: |
          set -euo pipefail
          for tag in $(jq -r '.[] | select(.kind == "release") | .tag' <<< "$RELEASES"); do
            body=$(gh release view "$tag" --json body --jq .body)
            if grep -q '^### Tested with Hatchet' <<< "$body"; then
              continue
            fi
            versions=$(git show "$tag:test/hatchet-versions" 2>/dev/null | awk '!/^#/ && NF {print "- `" $1 "`"}' || true)
            if [[ -z "$versions" ]]; then
              continue
            fi
            printf '%s\n\n### Tested with Hatchet\n\n%s\n\nThe first version is the minimum supported version.\n' "$body" "$versions" > "$RUNNER_TEMP/notes.md"
            gh release edit "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          done
