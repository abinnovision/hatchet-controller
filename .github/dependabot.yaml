# $schema: https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/dependabot-2.0.json
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    open-pull-requests-limit: 5
    schedule:
      interval: daily
    labels:
      - dependencies
    commit-message:
      prefix: "fix(deps)"
    cooldown:
      default-days: 5
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /tools
    open-pull-requests-limit: 5
    schedule:
      interval: daily
    labels:
      - dependencies
    commit-message:
      prefix: "build(deps)"
    cooldown:
      default-days: 5
    groups:
      tool-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 5
    schedule:
      interval: daily
    labels:
      - dependencies
    commit-message:
      prefix: "ci(deps)"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    open-pull-requests-limit: 5
    schedule:
      interval: daily
    labels:
      - dependencies
    commit-message:
      prefix: "fix(deps)"
    cooldown:
      default-days: 5
    groups:
      docker-images:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /test/e2e/testdata
    open-pull-requests-limit: 5
    schedule:
      interval: daily
    labels:
      - dependencies
    commit-message:
      prefix: "test(deps)"
    cooldown:
      default-days: 5
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    groups:
      e2e-images:
        patterns: ["*"]
